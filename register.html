<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account - Ludo Lane</title>
  <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand" href="index.html"><img src="assets/images/logo.svg" alt="" width="34" height="34"><span>Ludo Lane</span></a>
    <h1>Create account</h1>
    <p id="config-warning" class="alert" hidden>Firebase is not configured yet, so accounts are unavailable. Offline and AI modes work without an account. See the README to set up Firebase.</p>
    <form id="auth-form" novalidate>
      <label class="field">Display name<input id="name" type="text" maxlength="20" autocomplete="nickname" required></label>
      <label class="field">Email<input id="email" type="email" autocomplete="email" required></label>
      <label class="field">Password (6+ characters)<input id="password" type="password" autocomplete="new-password" minlength="6" required></label>
      <label class="field">Repeat password<input id="password2" type="password" autocomplete="new-password" required></label>
      <p id="form-error" class="alert" role="alert" hidden></p>
      <button class="btn primary wide" type="submit">Create account</button>
    </form>
    <p class="muted">Already registered? <a href="login.html">Log in</a>.</p>
  </main>
  <script type="module" src="js/auth-pages.js"></script>
</body>
</html>
